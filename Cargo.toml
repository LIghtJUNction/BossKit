[package]
name = "bosskit"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Read-only multi-platform job search CLI and MCP server"
repository = "https://github.com/LIghtJUNction/BossKit"
readme = "README.md"

[[bin]]
name = "boss"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1"
dirs = "6"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies", "form", "json", "query", "rustls"] }
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
url = "2"
wait-timeout = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
assert_cmd = "2"

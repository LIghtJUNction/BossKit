[package]
name = "bosskit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only multi-platform job search CLI and MCP server"

[[bin]]
name = "boss"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1"
dirs = "6"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
